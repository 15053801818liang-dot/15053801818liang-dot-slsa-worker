# =============================================================================
# SLSA Level 3 构建与发布流水线
# =============================================================================
# 控制映射（对照 SLSA v1.0 规范）：
#   ① 构建隔离  → runs-on: ubuntu-latest（GitHub 托管，临时、用完即毁 runner）
#                  每个 job 独立 VM；concurrency 防止并发污染
#   ② 密钥隔离  → build/provenance job 仅 contents:read，无任何密钥
#                  签名权限（id-token/attestations）仅在独立的 provenance job
#                  deploy 密钥（CLOUDFLARE_API_TOKEN）仅在 deploy job
#   ③ 不可伪造溯源 → provenance job 与 build 分离，由平台托管的
#                  actions/attest-build-provenance 生成 Sigstore keyless 签名
#                  build 步骤无 id-token 权限，无法伪造溯源
#   ④ 源码审计  → 仅由 Git 提交触发；checkout 禁用持久凭据
#   ⑤ 产物-部署一致性 → deploy 不重新构建，而是 download-artifact 取回
#                  被签名的同一份字节，并以阻断式 gh attestation verify 为门禁，
#                  失败即中止部署。避免"签了 A、上线 B"的溯源链断裂。
#   ⑥ 负向自检  → canary job 以正向/反向对照证明溯源机制真实有效；
#                  build job 以运行时探测证明 OIDC 令牌确实不可达。
# -----------------------------------------------------------------------------
# 【权限模型说明 — 请勿放宽仓库全局设置】
#   GITHUB_TOKEN 权限的计算顺序（GitHub 官方文档）：
#     企业/组织/仓库默认值  →  workflow 顶层 permissions  →  job 级 permissions
#   本文件在顶层设最小权限 contents:read，仅在确需的 job 内按最小集合提权。
#   一旦使用 permissions 键，"未列出的范围一律为 none"，因此权限是白名单式的。
#
#   ⛔ 反模式：把仓库 Settings → Actions → General → Workflow permissions
#      改为 "Read and write permissions"，或勾选
#      "Allow GitHub Actions to create and approve pull requests"。
#      · id-token / attestations 从不由该开关自动授予，必须显式声明（本文件已声明），
#        故放宽全局设置对溯源生成毫无帮助；
#      · "create and approve pull requests" 允许 Actions 自动批准 PR，
#        会直接绕过 CODEOWNERS 双人审查，摧毁 SLSA 的源码审计控制。
#   ✅ 正确做法：仓库级 Workflow permissions 保持/收紧为只读即可。
# =============================================================================

name: Build & Release (SLSA L3)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 全局默认权限：最小权限原则
permissions:
  contents: read

# 同一 ref 的并发构建串行化，杜绝跨构建状态残留
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # 构建：临时 runner，无密钥，产出可复现产物
  # ---------------------------------------------------------------------------
  build:
    name: Build (ephemeral, isolated)
    runs-on: ubuntu-latest
    # 【刻意的能力剥夺】此 job 执行不受信的用户构建脚本（npm ci / build），
    # 因此只给 contents:read —— 没有 id-token，就拿不到 OIDC 令牌，
    # 也就无法向 Sigstore 申请签名证书。构建步骤即使被投毒也伪造不出溯源。
    permissions:
      contents: read
    outputs:
      # 注：hashes 仅供文末注释中的 slsa-github-generator 备选方案消费。
      #     当前主路径由 provenance job 以 subject-path 独立重算摘要，不消费此输出，
      #     因此被投毒的构建无法通过"谎报摘要"影响溯源绑定。
      hashes: ${{ steps.hash.outputs.hashes }}
      artifact-name: worker-bundle
    steps:
      - name: 🐤 Canary — 运行时证明 OIDC 令牌不可达
        shell: bash
        run: |
          set -uo pipefail
          # 本 job 未声明 id-token 权限，GitHub 不应注入 OIDC 请求变量。
          # 若任一变量存在，说明权限模型已被破坏：构建步骤将能向 Sigstore
          # 申请签名证书并伪造溯源，必须立即中止整条流水线。
          # 这一步把"声明层面无 id-token"升级为"运行时已验证"。
          leak=0
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then leak=1; fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then leak=1; fi
          if [ "$leak" -ne 0 ]; then
            echo "::error::权限模型失效：build job 可获取 OIDC 令牌，存在伪造溯源风险"
            exit 1
          fi
          echo "✅ OIDC 令牌不可达 —— 构建步骤在运行时确实无法申请 Sigstore 签名证书"

      - name: Checkout（不持久化凭据）
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node（LTS 22）
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖（从锁文件，可复现）
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建 Worker bundle
        run: npm run build

      - name: 生成产物摘要（sha256 + base64，供溯源绑定）
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          # sha256sum 输出格式: <hash>  <name>，base64 -w0 单行编码
          echo "hashes=$(sha256sum dist/* | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物（审计留痕）
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  # 溯源：独立 job，平台托管签名，build 步骤无法伪造
  # ---------------------------------------------------------------------------
  provenance:
    name: Provenance (platform-signed, non-falsifiable)
    needs: build
    runs-on: ubuntu-latest
    # 【唯一持有签名能力的 job】此处不执行任何项目自带脚本，
    # 只下载产物 + 调用平台托管的 attest action，故可安全授予签名权限。
    # 这两项权限是 job 级、非全局：仓库 Workflow permissions 无需改为 read-write。
    permissions:
      contents: read
      id-token: write      # OIDC → Sigstore keyless 签名（短期证书，无长期私钥落盘）
      attestations: write  # 上传溯源到 GitHub Attestations API
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: worker-bundle
          path: dist

      - name: 生成并签名 SLSA Build Provenance
        id: attest
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*
          show-summary: true

      - name: 输出溯源信息
        run: |
          echo "::notice::Provenance attestation created"
          echo "Attestation ID: ${{ steps.attest.outputs.attestation-id }}"
          echo "Attestation URL: ${{ steps.attest.outputs.attestation-url }}"

  # ===========================================================================
  # 备选溯源方案（参考实现，当前维护模式）— 保留注释供选择
  # ===========================================================================
  # 若需 SLSA 参考实现的"构建器"模式（构建在受信任 reusable workflow 内执行，
  # 不可伪造性更强），可改用 slsa-framework/slsa-github-generator。
  # 注意：该项目已进入维护模式，官方建议新集成使用上方的 GitHub Attestations。
  #
  # provenance-slsa:
  #   needs: build
  #   permissions:
  #     actions: read
  #     id-token: write
  #     contents: write
  #   uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
  #   with:
  #     base64-subjects: "${{ needs.build.outputs.hashes }}"
  #     upload-assets: true
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Canary：用正向/反向对照证明溯源机制真实有效（而非仅"已配置"）
  # ---------------------------------------------------------------------------
  # 此 job 不产出任何东西，唯一职责是充当"验证的验证"。若溯源机制形同虚设
  # （例如篡改后仍能通过校验），deploy 的门禁也就毫无意义，故 deploy 依赖它。
  canary:
    name: Canary (溯源机制正/反向对照)
    needs: provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read   # 只读：拉取 attestation 供校验，无签名能力
    steps:
      - name: 下载被签名的构建产物
        uses: actions/download-artifact@v4
        with:
          name: worker-bundle
          path: dist

      - name: 正向对照 — 原始产物必须通过校验
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify dist/index.js \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/build-release.yml" \
            --deny-self-hosted-runners
          echo "✅ 正向对照通过：未改动的产物溯源有效"

      - name: 反向对照 — 篡改后必须被拒绝
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # 追加一行无害注释，仅为改变字节从而改变 sha256 摘要。
          # 这不是恶意代码，只是让摘要失配的最小扰动。
          cp dist/index.js /tmp/tampered.js
          printf '\n// canary: benign marker appended to invalidate the digest\n' >> /tmp/tampered.js
          if gh attestation verify /tmp/tampered.js \
               --repo "${{ github.repository }}" \
               --signer-workflow "${{ github.repository }}/.github/workflows/build-release.yml" \
               >/dev/null 2>&1; then
            echo "::error::反向对照失败：被篡改的产物竟通过溯源校验，溯源机制失效！"
            exit 1
          fi
          echo "✅ 反向对照通过：篡改产物被正确拒绝（摘要失配）"

  # ---------------------------------------------------------------------------
  # 部署：只部署"被签名的那一份字节"，阻断式溯源门禁
  # ---------------------------------------------------------------------------
  # 【关键修复】此 job 绝不重新构建。旧版在此执行 `npx wrangler deploy`，
  # 等于从源码另建一份产物上线 —— 被签名的是 build job 的产物，上线的却是
  # 第三份字节，溯源链对生产环境实际失效（"签了 A、上线 B"）。
  # 现改为 download-artifact 取回被签名产物 + --no-bundle 直传。
  deploy:
    name: Deploy (attested bytes only, hard-gated)
    needs: [build, provenance, canary]
    runs-on: ubuntu-latest
    # Task 16: 生产部署仅允许显式 workflow_dispatch(main) 触发；
    # 普通 main push 只负责 build → provenance → canary，不再隐式授权部署。
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      attestations: read   # 只读：门禁校验所需，无签名能力
    environment:
      name: production
    steps:
      - name: Checkout（仅取 wrangler 配置与锁文件，不用于构建产物）
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装 wrangler CLI（禁用依赖生命周期脚本）
        # --ignore-scripts：本 job 持有 CLOUDFLARE_API_TOKEN，绝不允许依赖的
        # postinstall/prepare 在此执行任意代码窃取密钥。已实测 wrangler 4.120.0
        # 在 --ignore-scripts 下可正常工作。
        run: npm ci --ignore-scripts

      - name: 取回被溯源签名的产物（不重新构建）
        uses: actions/download-artifact@v4
        with:
          name: worker-bundle
          path: dist

      - name: 阻断式溯源门禁（校验失败即中止，绝不上线未经溯源的字节）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 严格身份绑定：不仅要求"有溯源"，还要求溯源来自本仓库、本工作流、
          # 本 ref、本 commit，且构建发生在 GitHub 托管 runner 上。
          gh attestation verify dist/index.js \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/build-release.yml" \
            --source-ref "${{ github.ref }}" \
            --source-digest "${{ github.sha }}" \
            --deny-self-hosted-runners
          echo "✅ 门禁通过：即将上线的字节与被平台签名的产物完全一致"
          sha256sum dist/index.js

      - name: 部署被溯源的产物到 Cloudflare Workers
        env:
          # 密钥仅在此 job 可见；build / provenance / canary job 均无法访问
          # ──【用户填值点】── secrets.CLOUDFLARE_API_TOKEN 并非本仓库内置，
          # 须由仓库 Owner 在 GitHub → Settings → Secrets and variables → Actions
          # 手动新建一个名为 CLOUDFLARE_API_TOKEN 的仓库密钥（值 = 新 Cloudflare 账号的 API Token）。
          # 若新 Token 非账号绑定型，另需 CLOUDFLARE_ACCOUNT_ID secret。
          # 完整步骤见 .workbuddy/forensics/CF-Migration-Runbook.md 的 Step 0 / Step D。
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --no-bundle：直传上一步已校验的 bundle，跳过内部构建，
        # 确保"被验证的字节 == 被部署的字节"。
        run: npx wrangler deploy dist/index.js --no-bundle
